<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Rookie</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:ital,wght@0,600;0,700;1,600&family=Noto+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: kingdom select grid first; then the board is the hero with a story coach above and an eight-rank ladder beside it. Each kingdom re-skins every token. Single dark world by choice. */
:root{
  --ground:#121016; --surface:#1D1A22; --ink:#F3EFE8; --muted:#ADA6B4; --line:#34303C;
  --accent:#E2B04A; --accent-ink:#1A1206; --sqL:#E9E2D2; --sqD:#5B4E70; --frame:#2A2433;
  --good:#6BD69A; --bad:#F27A6E; --bad-soft:rgba(242,122,110,.5);
  --f-display:'Noto Serif Display', Georgia, 'Times New Roman', serif;
  --f-body:'Noto Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono:'JetBrains Mono', ui-monospace, Menlo, monospace;
  color-scheme:dark;
}
[data-k="benin"]{--ground:#1A100B;--surface:#2A1A12;--ink:#F3E6D3;--muted:#C4A98C;--line:#4A3122;--accent:#E8634A;--accent-ink:#1A0904;--sqL:#E8D3AE;--sqD:#8E3A22;--frame:#5A2414}
[data-k="oyo"]{--ground:#0E1230;--surface:#1A2050;--ink:#EEF0FA;--muted:#AEB5DB;--line:#2E3772;--accent:#F0B83C;--accent-ink:#1A1204;--sqL:#EFE7D3;--sqD:#34459C;--frame:#1F2A6B}
[data-k="egypt"]{--ground:#0C1426;--surface:#16213A;--ink:#F5EBD3;--muted:#BBB29B;--line:#2A3858;--accent:#E9B949;--accent-ink:#1A1204;--sqL:#EEDCAA;--sqD:#2E6F7E;--frame:#1C4652}
[data-k="persia"]{--ground:#0A1C20;--surface:#12292E;--ink:#F4EEE0;--muted:#A9C0BB;--line:#224247;--accent:#36C7BE;--accent-ink:#04191A;--sqL:#EEDDB8;--sqD:#1F6E72;--frame:#7A1E2E}
[data-k="rome"]{--ground:#17110F;--surface:#251C19;--ink:#F4EFE6;--muted:#BFB3A6;--line:#3E302B;--accent:#D23C44;--accent-ink:#FFF6EE;--sqL:#EFE9DD;--sqD:#86353A;--frame:#4A1D20}
[data-k="classic"]{--ground:#16130F;--surface:#221D18;--ink:#F2ECE2;--muted:#B7AC9C;--line:#3A322A;--accent:#D9A54A;--accent-ink:#1A1206;--sqL:#F0D9B5;--sqD:#B58863;--frame:#5C4330}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background-color:var(--ground);background-image:radial-gradient(900px 420px at 50% -140px, color-mix(in srgb, var(--accent) 20%, transparent), transparent 70%);background-repeat:no-repeat;
  color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px 48px;transition:background-color .4s}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.eyebrow{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:clamp(2rem,5vw,2.9rem);line-height:1;margin:0;letter-spacing:-.01em}
.brand h1 em{font-weight:600;color:var(--accent)}
.brand p{margin:6px 0 0;color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px 4px 5px;font-size:.88rem;font-weight:600;font-variant-numeric:tabular-nums}
.chip .ic{width:28px;height:28px;border-radius:50%;background:var(--sqL);display:grid;place-items:center}
.chip .ic svg{width:92%;height:92%}
.chip .sub{color:var(--muted);font-weight:500}
.chip .star{width:16px;height:16px;fill:var(--accent);margin-left:5px}
button.chip{cursor:pointer}
button.chip:hover{border-color:var(--accent)}

/* select */
.select{display:flex;flex-direction:column;gap:16px}
.select h2{font-family:var(--f-display);font-weight:700;font-size:clamp(1.5rem,3.6vw,2.1rem);margin:0;text-wrap:balance}
.select > div > p{color:var(--muted);max-width:64ch;margin:6px 0 0}
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.kstrip{max-width:260px}
.kcard{display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;color:var(--ink);transition:transform .18s ease,border-color .18s ease;min-width:0}
.kcard:hover{transform:translateY(-3px);border-color:var(--accent)}
.kstrip{display:grid;grid-template-columns:repeat(3,1fr);border-radius:8px;overflow:hidden;box-shadow:0 0 0 4px var(--frame);margin:4px}
.kstrip span{aspect-ratio:1;display:grid;place-items:center;background:var(--sqL)}
.kstrip span:nth-child(2){background:var(--sqD)}
.kstrip svg{width:92%;height:92%;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.kcard h3{font-family:var(--f-display);font-weight:700;font-size:1.45rem;margin:0;line-height:1.1}
.kcard p{margin:0;font-size:.88rem;color:var(--muted)}
.kcard .you{color:var(--ink);font-size:.86rem}
.kcard .you b{color:var(--accent);font-weight:600}
.kcard .prog{margin-top:auto;font-family:var(--f-mono);font-size:.72rem;color:var(--muted);border-top:1px solid var(--line);padding-top:8px}
.kcard .go{color:var(--accent);font-weight:700;font-size:.9rem}
.kcard.soon{cursor:not-allowed;opacity:.5;filter:grayscale(.55)}
.kcard.soon:hover{transform:none;border-color:var(--line)}
.soon-tag{display:inline-block;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
@media (prefers-reduced-motion:reduce){.kcard{transition:none}.kcard:hover{transform:none}}

/* game */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:24px;align-items:start}
@media (max-width:880px){.layout{grid-template-columns:minmax(0,1fr)}}
.stage{display:flex;flex-direction:column;gap:14px;min-width:0}
.coach{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;max-width:580px;align-items:start}
.por{width:64px;height:64px;border-radius:50%;background:var(--sqL);display:grid;place-items:center;box-shadow:0 0 0 3px var(--frame), 0 0 0 5px var(--accent);flex:none}
.por svg{width:90%;height:90%}
.por.v{background:var(--sqD)}
.coach h2{font-family:var(--f-display);font-weight:700;font-size:1.45rem;margin:2px 0 0;line-height:1.15;text-wrap:balance}
.coach h2 small{font-family:var(--f-body);font-size:.82rem;font-weight:500;color:var(--muted);margin-left:6px}
.coach p{margin:4px 0 0;max-width:62ch}
.task{display:inline-flex;align-items:center;gap:8px;margin-top:8px;font-weight:600;font-size:.92rem;background:color-mix(in srgb,var(--accent) 18%,transparent);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);padding:4px 11px;border-radius:999px}
.task::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}

.board-wrap{position:relative;width:min(100%,580px)}
.board{container-type:inline-size;display:grid;grid-template-columns:repeat(8,1fr);aspect-ratio:1;width:100%;max-width:100%;border-radius:8px;overflow:hidden;box-shadow:0 0 0 7px var(--frame),0 0 0 8px color-mix(in srgb,var(--accent) 60%,transparent),0 24px 50px -20px rgba(0,0,0,.8)}
.sq{position:relative;border:0;padding:0;margin:0;display:grid;place-items:center;cursor:pointer;background:var(--sqL);-webkit-tap-highlight-color:transparent}
.sq.d{background:var(--sqD)}
.sq .co{position:absolute;font-family:var(--f-mono);font-size:2.1cqi;line-height:1;pointer-events:none;color:var(--sqD);opacity:.9;z-index:4}
.sq.d .co{color:var(--sqL)}
.sq .co.f{right:.6cqi;bottom:.5cqi}
.sq .co.r{left:.6cqi;top:.5cqi}
.sq .pz{width:94%;height:94%;position:relative;z-index:2;pointer-events:none;filter:drop-shadow(0 .5cqi .35cqi rgba(0,0,0,.45))}
.sq.sel{box-shadow:inset 0 0 0 .7cqi var(--accent)}
.sq.last::before,.sq.hint::before,.sq.danger::before,.sq.mated::before,.sq.guide::before,.sq.found::before{content:"";position:absolute;inset:0;z-index:1}
.sq.guide::before{background:var(--accent);opacity:.3;animation:pulse 1.2s ease-in-out infinite alternate}
.sq.found::before{background:var(--good);opacity:.55}
.term{background:none;border:0;padding:0;color:inherit;font:inherit;text-decoration:underline dotted var(--accent);text-decoration-thickness:2px;text-underline-offset:3px;cursor:help}
.def{margin-top:10px;font-size:.9rem;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;max-width:62ch}
.def b{color:var(--accent);text-transform:capitalize}
.twin{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:.82rem;color:var(--muted)}
.twin .ic{width:40px;height:40px;border-radius:8px;background:#F0D9B5;display:grid;place-items:center;box-shadow:0 0 0 2px #B58863;flex:none}
.twin .ic svg{width:92%;height:92%}
.set-group{display:flex;flex-direction:column;gap:6px}
.set-group > span{font-weight:600;font-size:.9rem}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.opt{border:1px solid var(--line);background:var(--ground);border-radius:10px;padding:6px 11px;font-weight:600;font-size:.86rem;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.opt:hover{border-color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.sw{width:22px;height:22px;border-radius:4px;flex:none;background:linear-gradient(135deg,var(--a) 50%,var(--b) 50%);box-shadow:0 0 0 2px var(--c)}
.pim{object-fit:contain;display:block}
.board{grid-template-rows:repeat(8,minmax(0,1fr))}
.sq{min-width:0;min-height:0;overflow:hidden}
.sq .pz.pim{position:absolute;left:1%;top:1%;width:98%;height:98%}
.kstrip img{width:94%;height:94%;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.pt{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.chip .ic,.rank .rn{overflow:hidden}
.quiz{display:flex;flex-direction:column;gap:6px;margin-top:10px;max-width:460px}
.quiz .opt{justify-content:flex-start;text-align:left;background:var(--surface);font-size:.92rem;padding:9px 12px}
.quiz .opt.wrong{opacity:.5;text-decoration:line-through}
.quiz .opt.right{border-color:var(--good);box-shadow:0 0 0 1px var(--good)}
.promo-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.promo-pick{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--sqL);border:2px solid transparent;border-radius:12px;padding:8px 4px;cursor:pointer;color:#1a1206;font-weight:600;font-size:.8rem;text-transform:capitalize}
.promo-pick:hover,.promo-pick:focus-visible{border-color:var(--accent)}
.promo-pick svg,.promo-pick img{width:56px;height:56px;object-fit:contain}
.gloss{display:flex;flex-direction:column;gap:8px;max-height:min(70vh,440px);overflow:auto;margin:0;padding:0}
.gloss dt{font-weight:700;color:var(--accent);text-transform:capitalize}
.gloss dd{margin:0 0 4px;font-size:.92rem}
.sq.last::before{background:var(--accent);opacity:.32}
.sq.hint::before{background:var(--accent);opacity:.55;animation:pulse 1s ease-in-out infinite alternate}
.sq.danger::before{background:var(--bad-soft)}
.sq.mated::before{background:radial-gradient(circle,var(--bad) 0 42%,transparent 72%);opacity:.9}
.sq.lost .pz{animation:shake .4s ease}
.sq.dot::after{content:"";position:absolute;width:3.2cqi;height:3.2cqi;border-radius:50%;background:rgba(20,10,0,.35);z-index:3}
.sq.d.dot::after{background:rgba(255,255,255,.5)}
.sq.cap::after{content:"";position:absolute;inset:.7cqi;border-radius:50%;border:.8cqi solid var(--accent);z-index:3}
.sq .goal{width:7cqi;height:7cqi;fill:var(--accent);stroke:#1a1206;stroke-width:1;position:relative;z-index:2;pointer-events:none;filter:drop-shadow(0 1px 1px rgba(0,0,0,.4))}
@keyframes pulse{from{opacity:.25}to{opacity:.6}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6%)}75%{transform:translateX(6%)}}
@media (prefers-reduced-motion:reduce){.sq.hint::before,.sq.lost .pz{animation:none}}

.statusbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;width:min(100%,580px);margin-top:6px}
.msg{min-height:1.5em;font-weight:500;color:var(--muted);flex:1 1 220px;min-width:0}
.msg.good{color:var(--good)} .msg.bad{color:var(--bad)}
.counter{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.counter b{color:var(--ink)}
.controls{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 15px;border-radius:999px;font-weight:600;font-size:.9rem;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.on{background:var(--bad-soft);border-color:var(--bad)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}

/* overlays */
.overlay{position:absolute;inset:0;z-index:12;display:flex;align-items:flex-end;justify-content:center;padding:12px;border-radius:8px;
  background:linear-gradient(180deg, color-mix(in srgb,var(--ground) 15%,transparent), color-mix(in srgb,var(--ground) 90%,transparent) 62%)}
.overlay.mid{align-items:center;background:color-mix(in srgb,var(--ground) 60%,transparent);backdrop-filter:blur(2px)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;width:100%;max-width:520px;box-shadow:0 22px 50px -18px rgba(0,0,0,.7)}
.scene-card{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start}
.scene-card .por{width:72px;height:72px}
.scene-card h3,.win-card h3{font-family:var(--f-display);font-weight:700;margin:2px 0 0;font-size:1.3rem;line-height:1.15}
.scene-card p{margin:6px 0 0}
.scene-card .controls{margin-top:12px;justify-content:space-between;align-items:center;grid-column:1/-1}
.pager{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.promo{display:inline-flex;align-items:center;gap:6px;margin-top:10px;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:4px 12px;border-radius:999px;font-size:.85rem}
@media (max-width:480px){.scene-card .por{width:52px;height:52px}.card{padding:13px}}
.win-card{display:flex;flex-direction:column;gap:10px;max-width:400px}
.win-stars{display:flex;gap:6px}
.win-stars svg{width:32px;height:32px;fill:var(--line)}
.win-stars svg.got{fill:var(--accent)}
.win-card p{margin:0}
.win-card .takeaway{color:var(--muted);font-size:.93rem}
blockquote{margin:0;padding:8px 12px;border-left:3px solid var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent);border-radius:0 8px 8px 0;font-style:italic}
blockquote cite{display:block;font-style:normal;font-size:.8rem;color:var(--muted);margin-top:4px}

/* ladder */
aside.ladder{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0}
aside.ladder > .eyebrow{padding:0 6px 6px}
.rank{border-radius:10px;padding:8px 6px;display:flex;flex-direction:column}
.rank-btn{display:grid;grid-template-columns:34px minmax(0,1fr);gap:2px 10px;align-items:center;background:none;border:0;padding:0;text-align:left;width:100%;color:inherit}
button.rank-btn{cursor:pointer}
button.rank-btn:hover h4{color:var(--accent)}
.rank .rn{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-size:.78rem}
.rank.done .rn{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.rank.cur{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.rank.cur .rn{background:var(--sqL);border:2px solid var(--accent)}
.rank.cur .rn svg{width:26px;height:26px}
.rank.locked{opacity:.5}
.rank h4{margin:0;font-family:var(--f-display);font-weight:700;font-size:1.02rem;line-height:1.2}
.rank .what{font-size:.8rem;color:var(--muted)}
.rank ol{grid-column:1/-1;list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:1px}
.lvl{display:grid;grid-template-columns:24px minmax(0,1fr) auto;align-items:center;gap:9px;width:100%;text-align:left;background:transparent;border:0;border-radius:8px;padding:5px 6px;cursor:pointer}
.lvl:hover:not(:disabled){background:color-mix(in srgb,var(--ink) 7%,transparent)}
.lvl:disabled{cursor:not-allowed;opacity:.4}
.lvl .n{font-family:var(--f-mono);font-size:.72rem;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);font-variant-numeric:tabular-nums}
.lvl.done .n{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.lvl.cur{background:color-mix(in srgb,var(--accent) 18%,transparent)}
.lvl.cur .n{border:2px solid var(--accent)}
.lvl .t{font-size:.88rem;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lvl .s{display:flex;gap:1px}
.lvl .s svg{width:11px;height:11px;fill:var(--line)}
.lvl .s svg.got{fill:var(--accent)}
.foot{border-top:1px dashed var(--line);margin-top:8px;padding:10px 6px 0;display:flex;flex-direction:column;gap:8px}
.linkbtn{background:none;border:0;color:var(--muted);font-size:.8rem;text-decoration:underline;cursor:pointer;padding:0;align-self:flex-start}
.confirm{font-size:.85rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Rookie<em>.</em></h1>
      <p>Start as a rookie. Conquer the kingdom and become a master.</p>
    </div>
    <div class="chips" id="chips"></div>
  </header>

  <section class="select" id="select" hidden>
    <div>
      <h2>Choose your kingdom</h2>
    </div>
    <div class="kgrid" id="kgrid"></div>
  </section>

  <div class="layout" id="game" hidden>
    <section class="stage">
      <div class="coach" id="coach"></div>
      <div class="board-wrap">
        <div class="board" id="board" role="grid" aria-label="Chess board"></div>
        <div class="overlay mid" id="win" hidden></div>
        <div class="overlay" id="scene" hidden></div>
      </div>
      <div class="statusbar">
        <div class="msg" id="msg" aria-live="polite"></div>
        <div class="counter" id="counter"></div>
      </div>
      <div class="controls">
        <button class="btn" id="btnRestart" type="button">Restart</button>
        <button class="btn" id="btnHint" type="button">Hint</button>
        <button class="btn" id="btnDanger" type="button" hidden>Show danger squares</button>
        <button class="btn ghost" id="btnStory" type="button">Replay story</button>
        <button class="btn ghost" id="btnSettings" type="button">Board and sound</button>
        <button class="btn ghost" id="btnGloss" type="button">Glossary</button>
      </div>
    </section>
    <aside class="ladder" id="ladder" aria-label="Your ranks"></aside>
  </div>
</div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="grads"></defs></svg>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script>
(function(){
const F='abcdefgh';
const toIdx=s=>(s.charCodeAt(0)-97)+(+s[1]-1)*8;
const toSq=i=>F[i%8]+((i>>3)+1);

const DIRS={r:[[1,0],[-1,0],[0,1],[0,-1]],b:[[1,1],[1,-1],[-1,1],[-1,-1]]};
DIRS.q=DIRS.r.concat(DIRS.b); DIRS.k=DIRS.q;
const KN=[[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]];
const on=(f,r)=>f>=0&&f<8&&r>=0&&r<8;
function whiteMoves(type,pos,blacks){
  const f=pos%8,r=pos>>3,out=[];
  if(type==='n'||type==='k'){for(const [df,dr] of (type==='n'?KN:DIRS.k)){if(on(f+df,r+dr))out.push((r+dr)*8+f+df)}return out}
  if(type==='p'){
    if(r<7&&!blacks.has(pos+8)){out.push(pos+8);if(r===1&&!blacks.has(pos+16))out.push(pos+16)}
    for(const df of [-1,1]){if(on(f+df,r+1)&&blacks.has((r+1)*8+f+df))out.push((r+1)*8+f+df)}
    return out;
  }
  for(const [df,dr] of DIRS[type]){let nf=f+df,nr=r+dr;while(on(nf,nr)){const i=nr*8+nf;out.push(i);if(blacks.has(i))break;nf+=df;nr+=dr}}
  return out;
}
function attackersOf(sq,blacks){
  const res=[];
  for(const [i,t] of blacks){const f=i%8,r=i>>3;let hit=false;
    if(t==='p'){hit=[-1,1].some(df=>on(f+df,r-1)&&(r-1)*8+f+df===sq)}
    else if(t==='n'||t==='k'){hit=(t==='n'?KN:DIRS.k).some(([df,dr])=>on(f+df,r+dr)&&(r+dr)*8+f+df===sq)}
    else{for(const [df,dr] of DIRS[t]){let nf=f+df,nr=r+dr;while(on(nf,nr)){const j=nr*8+nf;if(j===sq){hit=true;break}if(blacks.has(j))break;nf+=df;nr+=dr}if(hit)break}}
    if(hit)res.push([i,t]);
  }
  return res;
}
function blacksFromMask(lv,mask){const m=new Map();lv._t.forEach((t,k)=>{if(t.type&&(mask>>k)&1)m.set(t.idx,t.type)});return m}
function prep(lv){
  if(lv._t)return lv;
  lv._t=[...(lv.stars||[]).map(s=>({idx:toIdx(s),type:null})),...Object.entries(lv.blacks||{}).map(([s,t])=>({idx:toIdx(s),type:t}))];
  lv._start=toIdx(lv.start);
  return lv;
}
function applyMini(lv,pos,mask,to){
  let nm=mask;lv._t.forEach((t,k)=>{if((nm>>k)&1&&t.idx===to)nm&=~(1<<k)});
  const bl=blacksFromMask(lv,nm);
  const att=lv.safe?attackersOf(to,bl):[];
  return {mask:nm,lost:att.length?att[0]:null,done:nm===0&&(!lv.promote||to>=56)};
}
function solveMini(lv,fromPos,fromMask){
  prep(lv);
  const start=fromPos==null?lv._start:fromPos, mask0=fromMask==null?(1<<lv._t.length)-1:fromMask;
  const key=(p,m)=>p+':'+m, prev=new Map([[key(start,mask0),null]]);
  let q=[[start,mask0]];
  while(q.length){const nq=[];
    for(const [p,m] of q){
      if(lv.piece==='p'&&p>=56)continue;
      for(const to of whiteMoves(lv.piece,p,blacksFromMask(lv,m))){
        const r=applyMini(lv,p,m,to); if(r.lost)continue;
        const k=key(to,r.mask); if(prev.has(k))continue; prev.set(k,[p,m]);
        if(r.done){const path=[to];let cur=[p,m];while(prev.get(key(cur[0],cur[1]))){path.unshift(cur[0]);cur=prev.get(key(cur[0],cur[1]))}return path}
        nq.push([to,r.mask]);
      }}
    q=nq;}
  return null;
}
//ENGINE-END

let SOUND=true,actx=null;
try{SOUND=localStorage.getItem('ptq2-sound')!=='0'}catch(e){}
const SCALES={benin:[0,2,4,7,9,12],oyo:[0,2,4,7,9,12],egypt:[0,1,4,5,7,8,12],persia:[0,1,4,5,7,8,12],rome:[0,4,7,12,16],classic:[0,4,7,12]};
function ac(){if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}if(actx.state==='suspended')actx.resume();return actx}
function tone(f,dur,{type='sine',vol=.15,at=0,to=null}={}){const c=ac();if(!c)return;const t=c.currentTime+at,o=c.createOscillator(),g=c.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(c.destination);o.start(t);o.stop(t+dur+.05)}
function knock(freq=1700,vol=.5,at=0){const c=ac();if(!c)return;const t=c.currentTime+at,len=Math.floor(c.sampleRate*.07),buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,4);
  const s=c.createBufferSource(),bp=c.createBiquadFilter(),g=c.createGain();s.buffer=buf;bp.type='bandpass';bp.frequency.value=freq;bp.Q.value=3;g.gain.value=vol;
  s.connect(bp).connect(g).connect(c.destination);s.start(t);tone(freq/9,.09,{vol:vol*.35,at})}
function melody(steps,{root=523.25,gap=.11,type='triangle',vol=.13,at=0}={}){steps.forEach((s,i)=>tone(root*Math.pow(2,s/12),gap*2.2,{type,vol,at:at+i*gap}))}
function sfx(name){
  if(!SOUND)return;const sc=SCALES[KID]||SCALES.classic;
  ({move:()=>knock(1700,.5),enemy:()=>knock(1200,.4),
    capture:()=>{knock(2000,.6);knock(1300,.5,.06)},
    star:()=>{tone(1318,.12,{vol:.12});tone(1760,.18,{vol:.1,at:.07})},
    found:()=>tone(988,.12,{vol:.1}),
    wrong:()=>tone(150,.22,{type:'square',vol:.05,to:105}),
    lost:()=>tone(420,.45,{type:'sawtooth',vol:.06,to:120}),
    check:()=>{tone(880,.1,{type:'triangle',vol:.12});tone(660,.16,{type:'triangle',vol:.12,at:.09})},
    promote:()=>{tone(392,.35,{vol:.1,to:1175});melody([12,16,19],{root:523.25,gap:.08,at:.3})},
    win:()=>melody(sc.slice(0,4).concat(sc[sc.length-1])),
    rank:()=>{melody(sc,{gap:.13,vol:.14});melody([0,sc[2],sc[sc.length-1]],{root:261.6,gap:.13*sc.length/3,type:'sine',vol:.1})},
    blip:()=>tone(660,.07,{vol:.06}),
    scene:()=>tone(523,.09,{type:'triangle',vol:.06})}[name]||(()=>{}))();
}
const art=()=>(CLASSIC||KID==='classic')?'classic':KID;
function pieceSVG(kid,t,army,cls){
  if(IMG[kid])return `<img class="${cls||'pz'} pim" src="${IMG[kid][army][t]}" alt="" draggable="false">`;
  const m=KINGDOMS[kid].mat[army];const c={F:`url(#g-${kid}-${army})`,D:m[2],S:m[3]};
  if(kid==='classic'&&army==='b')c.D=m[3];
  return `<svg class="${cls||'pz'}" viewBox="0 0 100 100" aria-hidden="true"><g fill="${c.F}" stroke="${c.S}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">${SH[t][kid](c)}<path d="M24 93 L76 93 L72 84 L28 84 Z"/></g></svg>`;
}

  if(ply>0&&g.insufficient_material())return 0;
  ms.sort((x,y)=>(y.captured?VAL[y.captured]*10-VAL[y.piece]:0)-(x.captured?VAL[x.captured]*10-VAL[x.piece]:0));
  let best=-Infinity;
  for(const m of ms){g.move(m);const v=-search(g,d-1,-b,-a,-col,ply+1);g.undo();
    if(v>best)best=v;if(v>a)a=v;if(a>=b)break;}
  return best;
}
function engineMove(g,level){
  const ms=g.moves({verbose:true});if(!ms.length)return null;
  const col=g.turn()==='w'?1:-1;
  if(level===1){
    for(const m of ms){g.move(m);const mate=g.in_checkmate();g.undo();if(mate)return m}
    const caps=ms.filter(m=>m.captured);
    if(caps.length&&Math.random()<0.6){caps.sort((x,y)=>VAL[y.captured]-VAL[x.captured]);return caps[0]}
    return ms[Math.floor(Math.random()*ms.length)];
  }
  const pcs=g.fen().split(' ')[0].replace(/[^a-zA-Z]/g,'').length;
  const depth=level===2?0:(pcs<=10?2:1),noise=level===2?40:10;
  let best=null,bv=-Infinity;
  for(const m of ms){g.move(m);let v=-search(g,depth,-Infinity,Infinity,-col,1);g.undo();
    v+=Math.random()*noise;if(v>bv){bv=v;best=m}}
  return best;
}

/* ---------- mini moves ---------- */
function tapMini(i){
  const lv=S.lv;if(S.busy||i===S.pos)return;
  if(lv.piece==='p'&&S.pos>=56)return;
  const bl=blacksFromMask(lv,S.mask),legal=whiteMoves(lv.piece,S.pos,bl);
  if(!legal.includes(i)){say(wrongMoveText(lv.piece,i,bl),'bad');sfx('wrong');return}
  const r=applyMini(lv,S.pos,S.mask,i);S.moves++;S.hint=null;
  if(r.lost){
    S.pos=i;S.mask=r.mask;S.busy=true;S.lostSq=i;S.last=i;renderBoard();renderCounter();sfx('move');setTimeout(()=>sfx('lost'),180);
    const [ai,at]=r.lost;say(`The enemy ${NAME[at]} on ${toSq(ai)} takes your ${NAME[lv.piece]}. Try again.`,'bad');
    const keep=S.danger;msgTimer=setTimeout(()=>{loadLevel(cur,false);if(keep)toggleDanger()},1700);return;
  }
  const took=lv._t.find((t,k)=>((S.mask>>k)&1)&&t.idx===i);
  S.pos=i;S.mask=r.mask;S.last=i;renderBoard();renderCounter();
  sfx(lv.piece==='p'&&i>=56?'promote':took&&took.type?'capture':took?'star':'move');
  if(r.done){finish(lv.piece==='p'&&i>=56?'Promoted!':'');return}
  if(lv.piece==='p'&&i>=56){say('You reached the far side but missed an enemy pawn. Restart and plan your path.','bad');return}
  if(lv.piece==='p'&&!whiteMoves('p',i,blacksFromMask(lv,r.mask)).length){say('Stuck. A pawn cannot move into a piece straight ahead. Restart.','bad');return}
  if(took&&took.type)say(`You took the ${NAME[took.type]}.`,'good');else if(took)say('Star collected.','good');else say('');
}
function wrongMoveText(p,i,bl){
  return {r:'This piece only moves in straight lines.',b:'This piece only moves diagonally.',q:'This piece moves in straight lines or diagonals, and cannot jump.',
    k:'The king moves only one square at a time.',n:'Knights move in an L: two squares, then one to the side.',
    p:bl.has(i)?'Pawns capture diagonally forward, never straight.':'Pawns only move forward. They capture diagonally.'}[p];
}
/* ---------- puzzle moves ---------- */
function goalMet(lv,g,m,wasCheck){if(lv.goal==='castle')return /[kq]/.test(m.flags);if(lv.goal==='castleQ')return m.flags.includes('q');if(lv.goal==='ep')return m.flags.includes('e');if(lv.goal==='check')return g.in_check();if(lv.goal==='capture')return wasCheck&&!!m.captured;return g.in_checkmate()}
function tapPuzzle(i){
  if(S.busy)return;const g=S.g,sq=toSq(i),p=g.get(sq);
  if(p&&p.color==='w'){S.sel=sq;renderBoard();return}
  if(!S.sel){say(p?'Those are enemy pieces. Pick one of yours.':'Pick one of your pieces first.');return}
  const wasCheck=g.in_check(),m=g.move({from:S.sel,to:sq,promotion:'q'});
  if(!m){say(`Your ${NAME[g.get(S.sel).type]} cannot move there.`,'bad');sfx('wrong');return}
  S.sel=null;S.last=m;S.hint=null;sfx(g.in_check()?'check':m.captured?'capture':'move');
  if(!goalMet(S.lv,g,m,wasCheck))setTimeout(()=>sfx('wrong'),260);
  if(goalMet(S.lv,g,m,wasCheck)){if(g.in_checkmate())S.mated=findKing(g,'b');S.busy=true;renderBoard();finish(g.in_checkmate()?'Checkmate!':'');return}
  S.mistakes++;S.busy=true;renderBoard();renderCounter();say(explainMiss(S.lv,g,m),'bad');
  msgTimer=setTimeout(()=>{g.undo();S.last=null;S.busy=false;renderBoard();say('Try another move.')},1900);
}
function findKing(g,c){for(let i=0;i<64;i++){const p=g.get(toSq(i));if(p&&p.type==='k'&&p.color===c)return toSq(i)}}
function explainMiss(lv,g,m){
  if(lv.goal==='castle'||lv.goal==='castleQ')return m.flags.includes('k')?'That is short castling. This time castle toward the other rook.':'That is a normal move. To castle, tap your king and move it two squares toward a rook.';
  if(lv.goal==='ep')return 'Capture the pawn that just moved by sliding your pawn diagonally to the square behind it.';
  if(lv.goal==='check')return 'That move does not attack the enemy king.';
  if(lv.goal==='capture')return m.captured?'That captures, but it was not the checking piece.':'That escapes check, but this lesson asks you to capture the attacker.';
  if(g.in_check()){const km=g.moves({verbose:true})[0];return km?`Check, but not mate. The enemy escapes with ${km.san}.`:'Close, but not mate.'}
  if(g.in_stalemate())return 'Stalemate! The enemy has no moves but is not in check. That is a draw.';
  return 'No check there. The enemy king is not attacked.';
}
/* ---------- Rank 0 taps ---------- */
function tapTap(i){
  if(S.busy)return;const st=stepOf(),V=st.sq.map(toIdx);
  if(S.found.has(i))return;
  if(!V.includes(i)){S.missed=true;renderBoard();say(st.miss||'Not that one. Follow the glowing squares.','bad');sfx('wrong');return}
  S.found.add(i);sfx(st.place?'move':'found');if(st.place)S.pieces.set(i,{t:st.place,c:'w'});
  renderBoard();renderCounter();
  if(S.found.size<st.need){const left=st.need-S.found.size;say(`Good. ${left} more.`,'good');return}
  say(st.ok||'Well done.','good');S.busy=true;
  msgTimer=setTimeout(()=>{
    if(S.step<S.lv.steps.length-1){S.step++;S.found=new Set();S.missed=false;S.busy=false;renderCoach();renderBoard();renderCounter();say('Tap a square on the board.')}
    else finish('');
  },st.ok?1100:650);
}
const REPLIES=['e5','d5','Nf6','Nc6','e6','c5','g6','d6'];
function tapTurns(i){
  if(S.busy)return;const g=S.g,sq=toSq(i),p=g.get(sq);
  if(p&&p.color==='w'){if(!g.moves({square:sq}).length){say(`That ${NAME[p.type]} is blocked right now. Try a pawn or a knight.`,'bad');return}S.sel=sq;S.hint=null;renderBoard();say('Now tap one of the dots.');return}
  if(!S.sel){say(p?'Those are enemy pieces. Wait for your turn and move your own.':'Tap one of your own pieces first.');return}
  const m=g.move({from:S.sel,to:sq,promotion:'q'});
  if(!m){say('That piece cannot move there. Tap one of the dots.','bad');return}
  S.sel=null;S.last=m;S.moves++;renderBoard();renderCounter();sfx(m.captured?'capture':'move');
  if(S.moves>=3){S.busy=true;finish('');return}
  S.busy=true;say('You moved. Now it is the enemy’s turn…');
  msgTimer=setTimeout(()=>{const legal=g.moves();const r=REPLIES.find(x=>legal.includes(x))||legal[Math.floor(Math.random()*legal.length)];
    S.last=g.move(r);S.busy=false;renderBoard();sfx('enemy');say(`The enemy answered. Your turn: move ${S.moves+1} of 3.`)},900);
}

/* ---------- line, play and quiz levels ---------- */
const sanCore=x=>x.replace(/[+#]/g,'');
function chessTap(i,onMove){
  const g=S.g,sq=toSq(i),p=g.get(sq);
  if(p&&p.color===g.turn()){if(!g.moves({square:sq}).length){say(`That ${NAME[p.type]} has no legal move right now.`,'bad');sfx('wrong');return}S.sel=sq;S.hint=null;renderBoard();return}
  if(!S.sel){say(p?'Those are enemy pieces. Pick one of yours.':'Pick one of your pieces first.');return}
  const cands=g.moves({square:S.sel,verbose:true}).filter(m=>m.to===sq);
  if(!cands.length){say(`Your ${NAME[g.get(S.sel).type]} cannot move there.`,'bad');sfx('wrong');return}
  const from=S.sel,go=pr=>{const m=g.move({from,to:sq,promotion:pr||'q'});S.sel=null;onMove(m)};
  if(cands.some(m=>m.promotion))pickPromo(go);else go();
}
function pickPromo(cb){
  S.busy=true;
  winEl.innerHTML=`<div class="card win-card" role="dialog" aria-label="Choose a piece"><div class="eyebrow">Promotion</div><h3>Your pawn becomes…</h3>
    <div class="promo-row">${['q','r','b','n'].map(t=>`<button type="button" class="promo-pick" data-t="${t}" aria-label="${NAME[t]}">${pieceSVG(art(),t,'w')}<span>${NAME[t]}</span></button>`).join('')}</div></div>`;
  winEl.hidden=false;
  winEl.querySelectorAll('.promo-pick').forEach(b=>b.onclick=()=>{winEl.hidden=true;S.busy=false;cb(b.dataset.t)});
}
function tapLine(i){
  if(S.busy)return;
  chessTap(i,m=>{
    const st=S.lv.line[S.step],g=S.g;S.last=m;renderBoard();
    if(st.want.some(w=>sanCore(w)===sanCore(m.san))){
      sfx(g.in_check()?'check':m.captured?'capture':m.promotion?'promote':'move');
      if(st.note)say(st.note,'good');
      S.step++;renderCounter();
      if(S.step>=S.lv.line.length){S.busy=true;finish(g.in_checkmate()?'Checkmate!':'');return}
      if(st.reply){S.busy=true;msgTimer=setTimeout(()=>{S.last=g.move(st.reply);S.busy=false;sfx('enemy');renderBoard()},900)}
    }else{
      S.mistakes++;S.busy=true;sfx('move');setTimeout(()=>sfx('wrong'),220);renderCounter();
      say(S.lv.miss||'Not the strongest move here. Try again.','bad');
      msgTimer=setTimeout(()=>{g.undo();S.last=null;S.busy=false;renderBoard()},1500);
    }
  });
}
const isDeveloped=g=>{const w=(q,t)=>{const p=g.get(q);return p&&p.color==='w'&&p.type===t};
  return !w('b1','n')&&!w('g1','n')&&!w('c1','b')&&!w('f1','b')&&((w('g1','k')&&w('f1','r'))||(w('c1','k')&&w('d1','r')))};
function drawReason(g){if(g.in_stalemate())return 'Stalemate! The enemy king had no legal move but was not in check. That is a draw.';
  if(g.insufficient_material())return 'Not enough pieces are left to checkmate. That is a draw.';
  if(g.in_threefold_repetition())return 'The same position appeared three times. That is a draw.';
  return 'The game ended in a draw.'}
function fail(title,text){
  say(text,'bad');sfx('lost');
  setTimeout(()=>{winEl.innerHTML=`<div class="card win-card" role="dialog" aria-label="${title}"><div class="eyebrow">Not this time</div><h3>${title}</h3><p>${text}</p>
    <div class="controls"><button class="btn primary" type="button" id="fRetry">Try again</button><button class="btn" type="button" id="fLook">Look at the board</button></div></div>`;
    winEl.hidden=false;$('fRetry').onclick=()=>loadLevel(cur,false);$('fLook').onclick=()=>{winEl.hidden=true;say('Press Restart when you are ready to try again.')};},700);
}
function tapPlay(i){
  if(S.busy)return;
  chessTap(i,m=>{
    const lv=S.lv,g=S.g;S.last=m;S.moves++;renderBoard();renderCounter();
    sfx(g.in_check()?'check':m.captured?'capture':m.promotion?'promote':'move');
    if(g.in_checkmate()){S.mated=findKing(g,'b');S.busy=true;renderBoard();finish('Checkmate!');return}
    if(lv.goal==='promote'&&m.flags.includes('p')){S.busy=true;finish('Promoted!');return}
    if(lv.goal==='develop'&&isDeveloped(g)){S.busy=true;finish('Ready for battle.');return}
    if(g.in_draw()){S.busy=true;fail('A draw',drawReason(g));return}
    if(lv.limit&&S.moves>=lv.limit){S.busy=true;fail('Out of moves',`You used all ${lv.limit} moves. Try again with a tighter plan.`);return}
    S.busy=true;say('The enemy is thinking…');
    msgTimer=setTimeout(()=>{
      const em=engineMove(g,lv.level);if(!em){S.busy=false;return}
      S.last=g.move(em);renderBoard();sfx(g.in_check()?'check':em.captured?'capture':'enemy');
      if(g.in_checkmate()){fail('Checkmate against you','The enemy trapped your king. Every loss teaches something. Try again.');return}
      if(lv.goal==='promote'&&!g.fen().split(' ')[0].includes('P')){fail('The pawn was lost','The enemy king captured your pawn. Keep your own king beside it.');return}
      if(g.in_draw()){fail('A draw',drawReason(g));return}
      S.busy=false;say(g.in_check()?'You are in check! Protect your king.':'Your move.');
    },420);
  });
}
function quizPick(j,btn){
  if(S.busy||S.lv.kind!=='quiz')return;const o=S.lv.options[j];
  if(o[1]){S.busy=true;btn.classList.add('right');sfx('found');finish('');return}
  S.mistakes++;btn.classList.add('wrong');btn.disabled=true;renderCounter();sfx('wrong');say(o[2],'bad');
}

/* ---------- hints ---------- */
function hint(){
  const lv=S.lv;if(S.busy)return;S.hinted=true;
  if(lv.kind==='tap'){S.missed=true;renderBoard();say('Follow the glowing squares.');return}
  if(lv.kind==='turns'){S.sel=null;S.hint='e2';renderBoard();say('Try the pawn in front of your king. Tap it, then tap a dot.');return}
  if(lv.kind==='quiz'){say(lv.hint||'Check each answer against the board.');return}
  if(lv.kind==='line'){const st=lv.line[S.step],m=S.g.moves({verbose:true}).find(x=>st.want.some(w=>sanCore(w)===sanCore(x.san)));if(m){S.sel=null;S.hint=m.from;renderBoard();say(`Try your ${NAME[m.piece]}.`)}return}
  if(lv.kind==='play'){const m=engineMove(S.g,3);if(m){S.sel=null;S.hint=m.from;renderBoard();say(`Try moving your ${NAME[m.piece]}.`)}return}
  if(lv.kind==='mini'){const path=solveMini(lv,S.pos,S.mask);if(!path){say('This path is a dead end. Restart the level.','bad');return}S.hint=path[0];renderBoard();say('Move to the glowing square.')}
  else{const g=S.g,wc=g.in_check();for(const m of g.moves({verbose:true})){const r=g.move(m);const ok=goalMet(lv,g,r,wc);g.undo();if(ok){S.hint=m.from;S.sel=null;renderBoard();say(`Try your ${NAME[m.piece]}.`);return}}}
}
function toggleDanger(){S.danger=!S.danger;$('btnDanger').classList.toggle('on',S.danger);$('btnDanger').textContent=S.danger?'Hide danger squares':'Show danger squares';renderBoard()}

/* ---------- finish ---------- */
function starsFor(){const lv=S.lv;let s=lv.kind==='mini'?(S.moves<=lv.par?3:S.moves<=lv.par+2?2:1):lv.kind==='play'?(lv.par?(S.moves<=lv.par?3:2):3):(S.mistakes===0?3:S.mistakes===1?2:1);if(S.hinted)s=Math.min(s,2);return s}
function finish(head){
  const lv=S.lv,practice=lv.ch===0,s=practice?3:starsFor();P.stars[lv.sid]=Math.max(P.stars[lv.sid]||0,s);save();
  say((head?head+' ':'')+(practice?'Lesson complete.':'Level complete.'),'good');
  const endOfCh=cur===LEVELS.length-1||LEVELS[cur+1].ch!==lv.ch;
  const detail=practice?'Practice lesson. No stars and no failing here, just learning.':lv.kind==='play'?(lv.par?`Done in ${S.moves} moves.${S.moves<=lv.par?' Excellent technique.':` Finish within ${lv.par} for three stars.`}`:`Won in ${S.moves} moves.`):lv.kind==='mini'?(S.moves<=lv.par?`Done in ${S.moves} moves, the fewest possible.`:`Done in ${S.moves} moves. It can be done in ${lv.par}.`):(S.mistakes===0?'First try.':`Solved after ${S.mistakes} miss${S.mistakes>1?'es':''}.`);
  const ls=K.lv[lv.sid];
  setTimeout(()=>{
    winEl.innerHTML=`<div class="card win-card" role="dialog" aria-label="Level complete">
      <div class="eyebrow">${practice?'Lesson':'Level'} ${lv.n} complete</div><h3>${head||(practice?'You have got it.':'Well fought.')}</h3>
      ${practice?'':`<div class="win-stars">${[1,2,3].map(k=>`<svg viewBox="0 0 24 24" class="${k<=s?'got':''}">${STAR_PATH}</svg>`).join('')}</div>`}
      <p>${detail}${S.hinted&&!practice?' Hints cap a level at two stars.':''}</p>
      ${ls?`<blockquote>${ls[2]}<cite>${K.cast[ls[0]][0]}</cite></blockquote>`:''}
      <p class="takeaway">${lv.take}</p>
      <div class="controls"><button class="btn" type="button" id="wReplay">Replay</button><button class="btn primary" type="button" id="wNext">${endOfCh?'Claim your rank':practice?'Next lesson':'Next level'}</button></div></div>`;
    winEl.hidden=false;renderLadder();renderChips();sfx('win');
    $('wReplay').onclick=()=>loadLevel(cur,false);$('wNext').onclick=advance;$('wNext').focus({preventScroll:true});
  },lv.kind==='puzzle'||lv.kind==='turns'?550:250);
}
function advance(){
  const lv=LEVELS[cur],endOfCh=cur===LEVELS.length-1||LEVELS[cur+1].ch!==lv.ch;
  winEl.hidden=true;
  if(!endOfCh){loadLevel(cur+1,true);return}
  const end=((K.ch[lv.ch]&&K.ch[lv.ch].end)||[]).map((l,j,a)=>j===a.length-1?[l[0],l[1],lv.ch+1]:l);
  playScene(end,()=>{if(cur<LEVELS.length-1)loadLevel(cur+1,true);else finale()});
}
function finale(){
  winEl.innerHTML=`<div class="card win-card" role="dialog" aria-label="Journey complete">
    <div class="eyebrow">Journey complete</div><h3>You are the ${K.names.q}.</h3>
    <p>You started in the front row knowing nothing about the board. You crossed all eight ranks and beat the enemy leader in a full game of chess.</p>
    <p class="takeaway">Next comes the Master’s path: advanced tactics, strategy and legendary games from history. It is being built now. Until then, replay any level for three stars or begin again in another kingdom.</p>
    <div class="controls"><button class="btn" type="button" id="fClose">Back to the board</button><button class="btn primary" type="button" id="fKing">Choose another kingdom</button></div></div>`;
  winEl.hidden=false;sfx('rank');$('fClose').onclick=()=>{winEl.hidden=true};$('fKing').onclick=showSelect;
}

/* ---------- events ---------- */
boardEl.addEventListener('click',e=>{const b=e.target.closest('.sq');if(!b||!winEl.hidden||!sceneEl.hidden)return;const i=+b.dataset.i;
  ({mini:tapMini,puzzle:tapPuzzle,tap:tapTap,turns:tapTurns,line:tapLine,play:tapPlay,quiz:()=>say('Choose one of the answers above the board.')})[S.lv.kind](i)});
CLASSIC=store.get('ptq2-classic')==='1';
const BOARDS={kingdom:['Kingdom'],wood:['Wood','#F0D9B5','#B58863','#5C4330'],green:['Tournament','#EEEED2','#769656','#3E5A2E'],slate:['Slate','#DEE3E6','#8CA2AD','#3C4A52'],night:['Night','#B9BED3','#4B5478','#232842']};
let BOARD=store.get('ptq2-board');if(!BOARDS[BOARD])BOARD='kingdom';
function applyBoard(){const w=document.querySelector('.board-wrap'),b=BOARDS[BOARD];
  ['--sqL','--sqD','--frame'].forEach((v,i)=>{if(BOARD==='kingdom')w.style.removeProperty(v);else w.style.setProperty(v,b[i+1])})}
applyBoard();
function openSettings(){
  const kb=getComputedStyle(document.body);
  const opt=(grp,val,label,on,extra='')=>`<button type="button" class="opt" data-g="${grp}" data-v="${val}" aria-pressed="${on}">${extra}${label}</button>`;
  const sw=(a,b,c)=>`<span class="sw" style="--a:${a};--b:${b};--c:${c}"></span>`;
  winEl.innerHTML=`<div class="card win-card" role="dialog" aria-label="Board and sound"><div class="eyebrow">Settings</div><h3>Board and sound</h3>
   ${KID==='classic'?'':`<div class="set-group"><span>Pieces</span><div class="seg">${opt('pc','k',K.name+' pieces',!CLASSIC)}${opt('pc','c','Classic pieces',CLASSIC)}</div></div>`}
   <div class="set-group"><span>Board</span><div class="seg">${Object.entries(BOARDS).map(([id,b])=>opt('bd',id,id==='kingdom'?K.name:b[0],BOARD===id,id==='kingdom'?sw(kb.getPropertyValue('--sqL'),kb.getPropertyValue('--sqD'),kb.getPropertyValue('--frame')):sw(b[1],b[2],b[3]))).join('')}</div></div>
   <div class="set-group"><span>Sound</span><div class="seg">${opt('snd','1','On',SOUND)}${opt('snd','0','Off',!SOUND)}</div></div>
   <div class="controls"><button class="btn primary" type="button" id="sClose">Done</button></div></div>`;
  winEl.hidden=false;$('sClose').onclick=()=>{winEl.hidden=true};
  winEl.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const g=b.dataset.g,v=b.dataset.v;
    if(g==='pc'){CLASSIC=v==='c';store.set('ptq2-classic',CLASSIC?'1':'0');if(S){renderBoard();renderCoach()}}
    if(g==='bd'){BOARD=v;store.set('ptq2-board',v);applyBoard()}
    if(g==='snd'){SOUND=v==='1';store.set('ptq2-sound',v)}
    winEl.querySelectorAll(`.opt[data-g="${g}"]`).forEach(x=>x.setAttribute('aria-pressed',x===b));
    sfx('blip');});
}
$('btnSettings').onclick=openSettings;
$('btnGloss').onclick=()=>{
  winEl.innerHTML=`<div class="card win-card" role="dialog" aria-label="Glossary"><div class="eyebrow">Chess words</div><h3>Glossary</h3>
    <dl class="gloss">${Object.entries(GLOSS).map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>
    <div class="controls"><button class="btn primary" type="button" id="gClose">Close</button></div></div>`;
  winEl.hidden=false;$('gClose').onclick=()=>{winEl.hidden=true};$('gClose').focus({preventScroll:true});
};
$('btnRestart').onclick=()=>loadLevel(cur,false);
$('btnHint').onclick=hint;
$('btnDanger').onclick=toggleDanger;
$('btnStory').onclick=()=>{winEl.hidden=true;storyFor(cur)};

const saved=store.get('ptq2-k');
if(saved&&KINGDOMS[saved]&&!KINGDOMS[saved].soon)startKingdom(saved);else showSelect();
})();
</script>
